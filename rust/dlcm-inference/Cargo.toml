[package]
name = "dlcm-inference"
version = "0.1.0"
edition = "2021"

[dependencies]
dlcm-core = { path = "../dlcm-core" }
candle-core = { version = "0.11.0", features = ["cuda"] }
candle-nn = { version = "0.11.0", features = ["cuda"] }
#candle-core = "0.11.0"
#candle-nn = "0.11.0"
safetensors = "0.8"
clap = { version = "4.6", features = ["derive"] }

#tokenizers = "0.23"
tokenizers = { version = "0.23", default-features = false, features = ["http", "onig"] }

rand = "0.8"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# DENY PANICS:
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[lints.rust]
unused_imports = "allow"
